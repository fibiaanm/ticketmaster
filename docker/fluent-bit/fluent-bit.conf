[SERVICE]
    Flush        2
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name             tail
    Path             /var/log/app/*.json
    Tag              app
    Parser           json
    DB               /tmp/flb_app.db
    Read_from_Head   true
    Refresh_Interval 5

# El timestamp de la app se conserva como log_time; @timestamp lo asigna Fluent Bit.
[FILTER]
    Name   modify
    Match  app
    Rename @timestamp log_time

[OUTPUT]
    Name               es
    Match              app
    Host               opensearch
    Port               9200
    Logstash_Format    On
    Logstash_Prefix    tickets-logs
    Suppress_Type_Name On
    Retry_Limit        False
